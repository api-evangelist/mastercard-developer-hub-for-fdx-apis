openapi: 3.0.3
info:
  title: Mastercard Developer Hub for FDX APIs FDX Authorization Server Application Check Controller User APIs API
  version: 1.0.0
  description: Dynamic Client Registration, Token, Introspection, Authorize API
  contact:
    name: API Support
    email: apisupport@mastercard.com
    url: https://developer.mastercard.com/support
servers:
- url: http://localhost:8080
  description: Localhost URL
tags:
- name: User APIs
  description: Return user response.
paths:
  /user:
    post:
      tags:
      - User APIs
      summary: Mastercard Developer Hub for FDX APIs Save user
      description: Return saved user response.
      operationId: saveUser
      parameters:
      - name: Authorization
        in: header
        description: This field indicate the Access Token id
        required: true
        schema:
          type: string
        example: Token Id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  description: This field indicate plain password
                  type: string
                  example: password
                userId:
                  description: This field indicate user id
                  type: string
                  example: fdxuser1
            examples:
              SaveUser:
                value:
                  password: password
                  userId: fdxuser1
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FdxUser'
  /user/{userId}:
    get:
      tags:
      - User APIs
      summary: Mastercard Developer Hub for FDX APIs Get user by user Id
      description: Return user response.
      operationId: getUser
      parameters:
      - name: Authorization
        in: header
        description: This field indicate the Access Token id
        required: true
        schema:
          type: string
        example: Token Id
      - name: userId
        in: path
        description: This field indicate the user ID
        required: true
        schema:
          type: string
        example: '2456777'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FdxUser'
components:
  schemas:
    FdxUser:
      type: object
      properties:
        errorCode:
          type: integer
          description: This field indicate the error code of application
          format: int32
          readOnly: true
          example: 401
        errorMessage:
          type: string
          description: This field indicate the error message
          readOnly: true
          example: UNAUTHORIZED
        userId:
          type: string
          description: This field indicate user id
          example: fdxuser
        passwordHash:
          type: string
          description: This field indicate hash password
          readOnly: true
          example: 243tfsdgdfg2253443
        password:
          type: string
          description: This field indicate plain password
          example: test
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
